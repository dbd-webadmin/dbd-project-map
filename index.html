<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DBD Project Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="assets/style.css?v=6" />
</head>
<body>

<header class="site-header">
  <div class="header-brand">
    <img class="logo-light" src="assets/logo-horizontal-dark.svg" alt="Destination by Design" />
    <img class="logo-dark" src="assets/logo-horizontal-white.svg" alt="Destination by Design" />
    <span class="header-title">Project Map</span>
  </div>
  <button class="hamburger" id="hamburger-toggle" title="Menu" aria-label="Menu" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="header-actions" id="header-actions">
    <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.5 12H2M22 12h-2.5M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.7A8.5 8.5 0 1 1 9.3 3.6a7 7 0 0 0 11.1 11.1Z"/></svg>
    </button>
    <button class="btn ghost" id="clear-filters">Clear Filters</button>
    <button class="btn" id="export-btn">Export PNG</button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div>
      <h2>Search</h2>
      <input type="text" id="search" class="search-box" placeholder="Search projects, clients, locations…" />
    </div>

    <div>
      <div class="toggle-row">
        <span>Show name &amp; location labels</span>
        <div class="switch" id="label-toggle"></div>
      </div>
    </div>

    <div>
      <h2>Filter by Category</h2>
      <div class="filter-group" id="category-filters"></div>
    </div>

    <div>
      <h2>Filter by State</h2>
      <div class="filter-group" id="state-filters"></div>
    </div>

    <div class="sidebar-stats">
      Showing <strong id="visible-count">0</strong> of <strong id="total-count">0</strong> projects
      &middot; <strong id="geocoded-count">0</strong> mapped (geocoding pending for the rest)
    </div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="export-watermark" id="office-watermark" title="See our office">
      <img src="assets/logo-icon.svg" alt="" />
      <span>Destination by Design</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="assets/app.js?v=10"></script>
</body>
</html>
